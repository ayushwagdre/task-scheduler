                    "xs": "4px",

                    "xl": "40px"

            "fontFamily": {

                    "label-caps": ["Inter"],

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-overlay {
            background: rgba(20, 20, 20, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .streak-glow {
            box-shadow: 0 0 40px rgba(52, 199, 89, 0.2);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface font-body-md text-on-surface antialiased selection:bg-primary selection:text-on-primary">
<!-- TopAppBar Fragment (Hidden on success screen to prioritize content focus per UX goal) -->
<main class="min-h-screen flex flex-col items-center justify-center relative overflow-hidden px-margin py-xl">
<!-- Background Ambient Glow -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-tertiary-container/10 rounded-full blur-[120px] pointer-events-none"></div>
<!-- Success Container -->
<div class="w-full max-w-md flex flex-col items-center text-center z-10">
<!-- Moment of Truth: Success Icon -->
<div class="relative mb-lg">
<div class="w-32 h-32 rounded-full border-2 border-tertiary/30 flex items-center justify-center bg-surface-container-highest/50 backdrop-blur-xl">
<span class="material-symbols-outlined text-[64px] text-tertiary" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<!-- Particle Accents -->
<div class="absolute -top-2 -right-2 w-4 h-4 bg-tertiary rounded-full animate-pulse"></div>
<div class="absolute bottom-4 -left-6 w-2 h-2 bg-tertiary/40 rounded-full"></div>
</div>
<!-- Task Completed Message -->
<h1 class="font-display text-display text-on-background mb-sm">Task Completed!</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-xl max-w-xs">You defied the friction. The stakes were high, but you delivered.</p>
<!-- Streak Card (Bento Style) -->
<div class="w-full bg-surface-container-low border border-outline-variant/30 rounded-xl p-lg mb-xl streak-glow relative overflow-hidden">
<!-- Subtle Gradient Glow -->
<div class="absolute inset-0 bg-gradient-to-tr from-tertiary/5 to-transparent pointer-events-none"></div>
<div class="flex flex-col items-center relative z-10">
<span class="font-label-caps text-label-caps text-tertiary uppercase tracking-widest mb-xs">Unstoppable</span>
<div class="flex items-baseline gap-xs">
<span class="font-display text-[72px] text-on-background leading-none">7</span>
<span class="font-h2 text-h2 text-on-surface-variant">Day Streak!</span>
</div>
<!-- Progress Bar (Thin, Minimal) -->
<div class="w-full h-1 bg-white/10 rounded-full mt-md overflow-hidden">
<div class="h-full bg-tertiary w-full"></div>
</div>
<div class="flex justify-between w-full mt-sm">
<span class="font-label-caps text-[10px] text-on-surface-variant/60">NEXT MILESTONE: 10 DAYS</span>
<span class="font-label-caps text-[10px] text-tertiary">+150 XP</span>
</div>
</div>
</div>
<!-- Rewards Grid -->
<div class="grid grid-cols-2 gap-gutter w-full mb-xl">
<div class="bg-surface-container-high/40 border border-white/5 p-md rounded-lg flex items-center gap-md">
<div class="p-xs bg-tertiary/10 rounded">
<span class="material-symbols-outlined text-tertiary" data-icon="account_balance_wallet">account_balance_wallet</span>
</div>
<div class="text-left">
<p class="font-label-caps text-[10px] text-on-surface-variant uppercase">Penalty Saved</p>
<p class="font-cta text-cta text-on-background">$25.00</p>
</div>
</div>
<div class="bg-surface-container-high/40 border border-white/5 p-md rounded-lg flex items-center gap-md">
<div class="p-xs bg-tertiary/10 rounded">
<span class="material-symbols-outlined text-tertiary" data-icon="bolt">bolt</span>
</div>
<div class="text-left">
<p class="font-label-caps text-[10px] text-on-surface-variant uppercase">Power Level</p>
<p class="font-cta text-cta text-on-background">Level 12</p>
</div>
</div>
</div>
<!-- CTA -->
<div class="w-full flex flex-col gap-md">
<button class="w-full h-14 bg-on-background text-surface font-cta text-cta rounded-lg hover:bg-white active:scale-95 transition-all duration-200 uppercase tracking-widest">
                    Keep Going
                </button>
<button class="w-full h-12 bg-transparent text-on-surface-variant font-cta text-[14px] rounded-lg hover:text-white transition-colors uppercase tracking-tight">
                    Share Success
                </button>
</div>
</div>
<!-- Detail Image Background (Subtle Texture) -->
<div class="fixed inset-0 -z-10 opacity-10">
<img alt="abstract futuristic grid" class="w-full h-full object-cover grayscale" data-alt="abstract tech grid with glowing lines and deep shadows representing digital discipline and structural order" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCR_X1K6DCEvfsYRum4J9FVUJCcePbi4eRgiCADTS0bOjaa6GK_o5WllYh8-J0gV7sSYqrQpLR-0_ZBfMZpQQosBtvG40UByj98rcM_NC3Z2lJ-S68MQf6EKIvQ_dPjrc9o5zqOMDuCeQwlxr5mHvlAHFoCNnctXC7U0UiZLP8Q353BwqOBG567dVs80z92b2xf04QJgvhonkO8H_fAygKAy2_zVD4GU4bQjQcHfD9eUvsP4lYT9mMHi0rSVQCeayCjP5zT0hWdUUt3"/>
</div>

<!-- Navigation suppressed per UX goal: Success screens are transactional/focus-priority destinations -->
</body></html>
