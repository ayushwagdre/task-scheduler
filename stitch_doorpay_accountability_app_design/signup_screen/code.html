        body { background-color: #141218; color: #e6e0e9; font-family: 'Inter', sans-serif; }

<body class="flex flex-col min-h-screen">
<!-- TopAppBar Segment (Modified for Signup Flow - Navigation Suppressed) -->
<header class="fixed top-0 w-full z-50 bg-black/70 backdrop-blur-md border-b border-white/10 shadow-[0_4px_30px_rgba(0,0,0,0.5)]">
<div class="flex justify-between items-center px-6 h-16 w-full max-w-none">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-white active:scale-95 duration-200 cursor-pointer">arrow_back</span>
<h1 class="text-xl font-black italic text-white tracking-widest uppercase font-inter">DOORPAY</h1>
</div>
<div class="flex items-center">
<span class="material-symbols-outlined text-white active:scale-95 duration-200" data-icon="local_fire_department">local_fire_department</span>
</div>
</div>
</header>
<main class="flex-grow flex flex-col items-center justify-center px-6 pt-24 pb-12">
<div class="w-full max-w-md space-y-xl">
<!-- Hero Content -->
<div class="text-center space-y-md">
<h2 class="font-display text-display text-on-background">COMMIT OR PAY.</h2>
<p class="font-body-md text-body-md text-on-surface-variant max-w-xs mx-auto">High-stakes accountability for those who refuse to fail.</p>
</div>
<!-- Signup Form Card -->
<div class="glass-card inner-glow-top p-8 rounded-xl shadow-[0_20px_40px_rgba(0,0,0,0.5)] space-y-lg">
<form class="space-y-md">
<!-- Name Input -->
<div class="space-y-xs">
<label class="font-label-caps text-label-caps text-outline uppercase">Name</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant focus:border-primary focus:ring-0 rounded-lg h-12 px-md font-body-md text-on-surface transition-all placeholder:text-zinc-600" placeholder="Identity" type="text"/>
</div>
<!-- Email Input -->
<div class="space-y-xs">
<label class="font-label-caps text-label-caps text-outline uppercase">Email</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant focus:border-primary focus:ring-0 rounded-lg h-12 px-md font-body-md text-on-surface transition-all placeholder:text-zinc-600" placeholder="discipline@doorpay.com" type="email"/>
</div>
<!-- Password Input -->
<div class="space-y-xs">
<label class="font-label-caps text-label-caps text-outline uppercase">Password</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant focus:border-primary focus:ring-0 rounded-lg h-12 px-md font-body-md text-on-surface transition-all placeholder:text-zinc-600" placeholder="••••••••" type="password"/>
</div>
<!-- Goal Selection Section -->
<div class="pt-4 space-y-md">
<label class="font-label-caps text-label-caps text-outline uppercase block">Choose Your Arena</label>
<div class="flex flex-wrap gap-sm">
<!-- Chips -->
<button class="flex items-center gap-xs px-md py-sm bg-primary text-on-primary font-cta text-cta rounded-full shadow-lg active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">fitness_center</span>
                                Fitness
                            </button>
<button class="flex items-center gap-xs px-md py-sm bg-surface-container-highest text-on-surface-variant font-cta text-cta border border-outline-variant/30 rounded-full hover:bg-surface-container-high transition-all active:scale-95" type="button">
<span class="material-symbols-outlined text-sm">school</span>
                                Study
                            </button>
<button class="flex items-center gap-xs px-md py-sm bg-surface-container-highest text-on-surface-variant font-cta text-cta border border-outline-variant/30 rounded-full hover:bg-surface-container-high transition-all active:scale-95" type="button">
<span class="material-symbols-outlined text-sm">bolt</span>
                                Productivity
                            </button>
</div>
</div>
<!-- CTA Button -->
<div class="pt-xl">
<button class="w-full bg-on-background text-surface font-display text-cta h-14 rounded-lg uppercase tracking-widest font-black hover:bg-white active:scale-[0.98] transition-all shadow-[0_0_20px_rgba(255,255,255,0.15)]">
                            Create Account
                        </button>
</div>
</form>
</div>
<!-- Alternative Options -->
<div class="text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Already committed? <a class="text-primary font-bold hover:underline" href="#">Log In</a>
</p>
</div>
</div>
</main>
<!-- Visual Polish: Gradient Orbs for Depth -->
