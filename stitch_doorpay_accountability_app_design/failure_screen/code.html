<style>
        .glass-bg {
            backdrop-filter: blur(20px);
            background: rgba(20, 20, 20, 0.7);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 48;
        }
        body {
            background-color: #0f0d13;
        }

    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-surface-container-lowest text-on-surface antialiased overflow-hidden">
<!-- Top Navigation Anchor (As per JSON) -->
<header class="fixed top-0 w-full z-50 bg-black/70 backdrop-blur-md text-white border-b border-white/10 shadow-[0_4px_30px_rgba(0,0,0,0.5)] flex justify-between items-center px-6 h-16 w-full max-w-none">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-surface-container-highest flex items-center justify-center overflow-hidden border border-white/10">
<img alt="User Profile" class="w-full h-full object-cover" data-alt="close up profile avatar of a determined athlete in shadow with high contrast lighting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuArO0djvO6i3R10LJzfUKgfU89xbm89zZinOrMusFqQJVnIoIvI9fc_6rVWEdKEtUvlSoxjAs8UMD6HajV-3mWjq3GQcRC0ZYl_S1lEnV3j1L9hdM95T669OBymwIcnNq8lP9GReze5AvvQPb1fG0zNpyRVktebgibj4Jtn3SL8fXaU2vLxnmIbPcb0hJMflWrRU0Bw44fP6A5KuC1qlMTR2_i78ZI6ULeysrUNyWTdW-dsYesPU2K4cixuAVDB6cB3Gaw41qMlZyob"/>
</div>
<span class="font-inter font-black uppercase tracking-tighter text-xl italic text-white tracking-widest">DOORPAY</span>
</div>
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-zinc-500 hover:text-emerald-400 transition-colors active:scale-95 duration-200">local_fire_department</span>
</div>
</header>
<!-- Main Failure Canvas -->
<main class="relative h-screen w-full flex flex-col items-center justify-center px-6 pt-16">
<!-- Background Atmospheric Element -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-20 overflow-hidden">
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-error rounded-full blur-[120px]"></div>
</div>
<!-- The Moment of Truth / Failure Modal Content -->
<div class="z-10 w-full max-w-md flex flex-col items-center text-center">
<!-- Warning Icon Section -->
<div class="mb-lg animate-pulse">
<div class="w-24 h-24 rounded-full bg-error-container/20 flex items-center justify-center border border-error/30">
<span class="material-symbols-outlined text-error !text-6xl" style="font-variation-settings: 'FILL' 1;">warning</span>
</div>
</div>
<!-- Failure Message -->
<div class="mb-lg space-y-xs">
<p class="font-label-caps text-label-caps text-error uppercase tracking-widest">ACCOUNTABILITY BREACHED</p>
<h1 class="font-display text-display text-white">You failed this task</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-xs mx-auto">The window for submission has closed. Your commitment was not met.</p>
</div>
<!-- Penalty Card (Glassmorphism) -->
<div class="w-full glass-bg rounded-xl p-lg mb-xl border border-error/20">
<div class="flex flex-col items-center gap-xs">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">PENALTY EXECUTED</span>
<span class="font-display text-display text-error">₹500 Charged</span>
<div class="w-full h-[1px] bg-white/10 my-md"></div>
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-on-surface-variant !text-sm">receipt_long</span>
<span class="font-body-md text-body-md text-on-surface-variant">Transaction ID: #DP-88219-F</span>
</div>
</div>
</div>
<!-- Actions -->
<div class="w-full space-y-md">
<button class="w-full h-[56px] bg-white text-black font-cta text-cta rounded-lg hover:bg-zinc-200 transition-all active:scale-95">
                    Try Again Tomorrow
                </button>
<button class="w-full h-[48px] bg-transparent text-on-surface-variant font-cta text-cta rounded-lg hover:text-white transition-all">
                    View Failure Log
                </button>
</div>
</div>
</main>
<!-- Bottom Navigation Shell (As per JSON) -->
<!-- Determined to be top-level relevant as this is a primary outcome screen -->
<nav class="fixed bottom-0 left-0 w-full h-20 flex justify-around items-center px-8 pb-4 bg-black/80 backdrop-blur-2xl border-t border-white/10 shadow-[0_-10px_40px_rgba(0,0,0,0.8)] z-50">
<div class="flex flex-col items-center justify-center text-zinc-600 hover:text-zinc-300 active:scale-90 transition-all duration-300 ease-in-out cursor-pointer">
<span class="material-symbols-outlined mb-1">alarm</span>
<span class="font-inter font-bold text-[10px] uppercase tracking-widest">Home</span>
</div>
<div class="flex flex-col items-center justify-center text-zinc-600 hover:text-zinc-300 active:scale-90 transition-all duration-300 ease-in-out cursor-pointer">
<span class="material-symbols-outlined mb-1">analytics</span>
<span class="font-inter font-bold text-[10px] uppercase tracking-widest">Stats</span>
</div>
<div class="flex flex-col items-center justify-center text-zinc-600 hover:text-zinc-300 active:scale-90 transition-all duration-300 ease-in-out cursor-pointer">
<span class="material-symbols-outlined mb-1">person</span>
<span class="font-inter font-bold text-[10px] uppercase tracking-widest">Profile</span>
</div>
</nav>
<!-- Visual Polish: Noise Overlay -->
<div class="fixed inset-0 pointer-events-none opacity-[0.03] z-[100] bg-[url('https://grainy-gradients.vercel.app/noise.svg')]"></div>
