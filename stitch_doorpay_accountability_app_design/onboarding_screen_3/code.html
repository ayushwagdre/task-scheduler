<style>
        .glass-card {
            background: rgba(20, 18, 24, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            border-left: 1px solid rgba(255, 255, 255, 0.15);
        }
        .critical-gradient {
            background: linear-gradient(135deg, #93000a 0%, #141218 100%);
        }
        .glow-red {
            box-shadow: 0 0 20px rgba(255, 59, 48, 0.2);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-black/70 backdrop-blur-md border-b border-white/10 shadow-[0_4px_30px_rgba(0,0,0,0.5)] flex justify-between items-center px-6 h-16 w-full max-w-none">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-surface-container-highest overflow-hidden">
<img class="w-full h-full object-cover" data-alt="professional male portrait with high contrast lighting and dark background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCZqq0Kwha-aF-elf4jXnd8laRbWMpU4y-NC0MF7f9uAQ2Yr40pbrKFjgMeZladCPbqtLS0N5OhhvciiATr4LowaStpLQI1ZUTdA-dh6yYk5E82HouN9AWGZKfNWazY-FPhIUkwARlHtSFLirBcW_D861-lzhCeL07a9Yr5VnIfAp3DbMA8S2gzVQUtYk7DsfAbGJ0VtEG8V_ddUPxMVi3ew_av8TLqdZM2T5fP-fT5bZoBPEar8eh33V3DqKwjjw69HXo7vEqupLPp"/>
</div>
<h1 class="text-xl font-black italic text-white tracking-widest font-inter uppercase">DOORPAY</h1>
</div>
<div class="flex items-center">
<span class="material-symbols-outlined text-white" data-icon="local_fire_department">local_fire_department</span>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow flex flex-col items-center justify-center px-margin pt-24 pb-32">
<!-- Hero Visual Section -->
<div class="w-full max-w-md space-y-xl">
<div class="relative flex justify-center py-xl">
<!-- Warning Symbol & Currency Hybrid Visual -->
<div class="relative z-10 w-48 h-48 rounded-full glass-card flex items-center justify-center glow-red">
<div class="absolute inset-0 bg-error/10 rounded-full animate-pulse"></div>
<div class="flex flex-col items-center space-y-2">
<span class="material-symbols-outlined text-[64px] text-error" data-icon="warning" style="font-variation-settings: 'FILL' 1;">warning</span>
<span class="material-symbols-outlined text-[48px] text-on-background" data-icon="payments">payments</span>
</div>
</div>
<!-- Abstract background decorative element -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 bg-error/5 blur-3xl rounded-full"></div>
</div>
<!-- Headline & Messaging -->
<div class="text-center space-y-md">
<h2 class="font-display text-display text-white uppercase italic tracking-tighter">
                    Fail = <span class="text-error">Pay</span>
</h2>
<p class="font-body-lg text-on-surface-variant max-w-sm mx-auto">
                    Accountability isn't free. Miss your daily discipline targets and your pre-committed penalty is triggered instantly. No excuses.
                </p>
</div>
<!-- Penalty Mechanics Grid -->
<div class="grid grid-cols-1 gap-gutter">
<div class="glass-card p-md rounded-xl flex items-center gap-md">
<div class="w-12 h-12 rounded-lg bg-surface-container-highest flex items-center justify-center">
<span class="material-symbols-outlined text-tertiary" data-icon="lock">lock</span>
</div>
<div>
<p class="font-label-caps text-on-surface-variant uppercase">Commitment</p>
<p class="font-h2 text-white">Stakes Locked</p>
</div>
</div>
<div class="glass-card p-md rounded-xl flex items-center gap-md border-error/20">
<div class="w-12 h-12 rounded-lg bg-error-container flex items-center justify-center">
<span class="material-symbols-outlined text-error" data-icon="gavel" style="font-variation-settings: 'FILL' 1;">gavel</span>
</div>
<div>
<p class="font-label-caps text-on-surface-variant uppercase">Enforcement</p>
<p class="font-h2 text-white">Zero Friction</p>
</div>
</div>
</div>
</div>
</main>
<!-- Fixed Bottom Actions -->
<div class="fixed bottom-0 left-0 w-full p-margin bg-gradient-to-t from-background via-background/90 to-transparent">
<div class="max-w-md mx-auto space-y-md">
<!-- Progress Indicator -->
<div class="flex justify-center gap-xs">
<div class="h-1 w-8 rounded-full bg-surface-container-highest"></div>
<div class="h-1 w-8 rounded-full bg-surface-container-highest"></div>
<div class="h-1 w-12 rounded-full bg-white"></div>
</div>
<button class="w-full h-[56px] bg-white text-black font-cta text-cta uppercase tracking-widest rounded-lg active:scale-95 transition-all duration-200 shadow-[0_10px_30px_rgba(255,255,255,0.1)]">
                Get Started
            </button>
</div>
</div>
<!-- Background Decoration -->
<div class="fixed top-0 left-0 w-full h-full pointer-events-none -z-10 overflow-hidden">
<div class="absolute -top-[10%] -right-[10%] w-[50%] h-[50%] bg-primary/5 blur-[120px] rounded-full"></div>
<div class="absolute -bottom-[10%] -left-[10%] w-[50%] h-[50%] bg-error/5 blur-[120px] rounded-full"></div>
</div>
